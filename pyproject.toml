# PlantHelixSeek — Python project configuration
# ──────────────────────────────────────────────────────────────────────────
# Torch is intentionally NOT in [project.dependencies].
# Install it FIRST according to your platform:
#
#   【NVIDIA GPU — CUDA 12.8】
#     pip install torch --index-url https://download.pytorch.org/whl/cu128
#
#   【Huawei Ascend NPU】
#     pip install torch==2.5.1
#     pip install torch-npu==2.5.1.post1
#
#   【CPU only / dev】
#     pip install torch
# ──────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planthelixseek"
version = "1.0.0"
description = "PlantHelixSeek: A Hybrid SSM-Attention Mixture-of-Experts DNA Language Model for Plants"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Zhangtaolab", email = "forrest_zhang@163.com"},
]
keywords = [
    "dna", "genomics", "bioinformatics", "language-model",
    "transformer", "mamba", "moe", "plant-genomics", "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "transformers==4.49.0",
    "tokenizers>=0.19.0",
    "datasets>=2.10.0",
    "evaluate>=0.4.0",
    "accelerate>=0.20.0",
    "numpy>=1.24.0",
    "einops>=0.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "biopython>=1.81.0",
    "tensorboard>=2.13.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "rich>=13.5.0",
]

[project.optional-dependencies]
# NVIDIA GPU: Flash Attention + Flash Linear Attention (CUDA only)
gpu = [
    "flash-attn>=2.0.0",
    "flash-linear-attention==0.4.1",
]
# Huawei Ascend NPU: torch-npu must be installed separately
npu = [
    "torch-npu>=2.5.0",
]
# Development / testing
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://huggingface.co/zhangtaolab/PlantHelixSeek"
Documentation = "https://github.com/zhangtaolab/PlantHelixSeek#readme"
Repository = "https://github.com/zhangtaolab/PlantHelixSeek.git"
"Bug Tracker" = "https://github.com/zhangtaolab/PlantHelixSeek/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["tests*", "venv*", ".venv*", ".git*", "models*", "data*", "instruct*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests that require GPU",
    "smoke: quick end-to-end verification tests",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
